# A canary of every green main, cheaply (docs/release.md, "Cutting a canary"): when the merge
# gate's run on a push to main ends green, `canary.py cut` tags that commit v0.YYYYMMDD.N through
# the API and dispatches release.yaml on the tag, which publishes it as a prerelease and starts
# promote.yaml. No commit goes to main, so nothing races a merge. At most one release builds at a
# time and one is cut per `min_minutes`; a green main inside that window is cut by the hourly run
# (or the next green push). By hand: `gh workflow run canary.yaml` (`-f push=false` shows what it
# would tag).
name: canary
on:
  workflow_run:
    workflows: [blaze]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "tag and dispatch release.yaml (false: say what it would tag)"
        type: boolean
        default: true
      min-minutes:
        description: "minutes since the last release before another is cut"
        default: "30"

# A cut waiting is replaced by a newer one. canary.py waits out a running release-cut.yaml
# (both number releases from the same tags) by cutting nothing while it runs.
concurrency:
  group: canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cut:
    name: cut
    if: >-
      github.repository == 'indexable-inc/blaze' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          MINUTES: ${{ inputs.min-minutes || '30' }}
        run: |
          jq -n --argjson push "$PUSH" --argjson minutes "$MINUTES" '{push: $push, min_minutes: $minutes}' > "$RUNNER_TEMP/cut.json"
          python3 -I .github/scripts/canary.py cut "$RUNNER_TEMP/cut.json"
