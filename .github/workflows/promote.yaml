name: promote

# A canary release becomes stable (docs/release.md). release.yaml dispatches this when it has
# published a release as a prerelease (a release the workflow's own token publishes starts no
# `release:` workflow); a run by hand takes the tag again, after a flake or a fix to the gate
# itself. Against the archives the release published, installed with install.sh --version as a
# user installs them, on macOS (Apple silicon) and Linux (x86-64, ARM64): install checks, the
# whole smoke corpus (harness/smoke.py), and the train (train.yaml, every tier) on the tag. All
# green: the same release is marked stable and Latest, with a line in its notes saying when and
# after which run (.github/scripts/promote.py). Any red: it stays a canary, and an issue says
# what failed and how to repeat it. Nothing is built again: a version names the same bytes
# before and after.
#
# A pull request changing the gate runs it against the newest release, without the train,
# without promoting and without an issue.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "the release to test (v0.YYYYMMDD.N; empty: the newest)"
        default: ""
      promote:
        description: "mark it stable when every job passes"
        type: boolean
        default: true
      train-run:
        description: "a green train.yaml run on the tag to count instead of starting one (its id)"
        default: ""
  pull_request:
    paths:
      - ".github/workflows/promote.yaml"
      - ".github/scripts/promote.py"
      - "harness/smoke.py"
      - "harness/smoke/**"

concurrency:
  group: promote-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release:
    name: which release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.which.outputs.tag }}
      sha: ${{ steps.which.outputs.sha }}
      prerelease: ${{ steps.which.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          WANTED: ${{ inputs.tag }}
        run: |
          jq -n --arg tag "$WANTED" '{tag: $tag}' > "$RUNNER_TEMP/which.json"
          python3 -I .github/scripts/promote.py which "$RUNNER_TEMP/which.json"

  smoke:
    name: smoke (${{ matrix.os }})
    needs: release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    env:
      BLAZE_REPO: ${{ github.repository }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: a CARGO_HOME of its own
        run: echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
      # Build scripts, proc macros and tests run in a sandbox made of namespaces a user makes,
      # which Ubuntu's AppArmor keeps users from making unless told otherwise.
      - name: user namespaces
        if: runner.os == 'Linux'
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != 0 ]; then
            sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # As a user installs it: the toolchain blaze downloads included.
      - name: install ${{ env.TAG }}
        run: sh install.sh --version "$TAG"
      - name: what it installed runs
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          blaze --version | tee /dev/stderr | grep -F "blaze ${TAG#v} "
          cd "$RUNNER_TEMP"
          blaze new --quiet hello
          cd hello
          blaze run | grep -Fx "Hello, world!"
          blaze stop
      - name: what the projects build with
        if: runner.os == 'Linux'
        run: |
          read -ra packages <<< "$(python3 -I harness/smoke.py apt)"
          if [ "${#packages[@]}" -gt 0 ]; then sudo apt-get update -qq && sudo apt-get install -y -qq "${packages[@]}"; fi
      - name: smoke corpus
        env:
          # anim is private: read with the bot's token.
          GH_TOKEN: ${{ secrets.BLAZE_BOT_TOKEN || github.token }}
        run: |
          export PATH="$CARGO_HOME/bin:$PATH"
          python3 -I harness/smoke.py "{\"blaze_rev\": \"${{ needs.release.outputs.sha }}\", \"work\": \"$RUNNER_TEMP/smoke\", \"results\": \"$RUNNER_TEMP/${{ matrix.os }}.json\"}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/${{ matrix.os }}.json
          if-no-files-found: ignore

  # The train's every tier, on the tag: built from the tag's commit, which is what the release's
  # archives were built from. A tag's train releases nothing and opens no issue (train.yaml).
  train:
    name: train on the tag
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: train.yaml on ${{ env.TAG }}
        run: |
          id="${{ inputs.train-run }}"
          if [ -z "$id" ]; then
            began=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run train.yaml -R "$GITHUB_REPOSITORY" --ref "$TAG"
            for _ in $(seq 30); do
              sleep 10
              id=$(gh run list -R "$GITHUB_REPOSITORY" -w train.yaml -b "$TAG" -e workflow_dispatch -L 5 \
                --json databaseId,createdAt -q "[.[] | select(.createdAt >= \"$began\")][0].databaseId // empty")
              [ -n "$id" ] && break
            done
            [ -n "$id" ] || { echo "::error::the train dispatched on $TAG did not start"; exit 1; }
          fi
          echo "train: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" | tee -a "$GITHUB_STEP_SUMMARY"
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 120 --exit-status > /dev/null
          [ "$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json headBranch -q .headBranch)" = "$TAG" ] ||
            { echo "::error::run $id is not a train on $TAG"; exit 1; }

  verdict:
    name: promote or file
    needs: [release, smoke, train]
    if: always() && github.event_name == 'workflow_dispatch' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: smoke-*
          path: results
      - name: promote ${{ env.TAG }}
        if: needs.smoke.result == 'success' && needs.train.result == 'success' && inputs.promote
        run: |
          jq -n --arg tag "$TAG" --arg run "$RUN" '{tag: $tag, run: $run}' > "$RUNNER_TEMP/promote.json"
          python3 -I .github/scripts/promote.py promote "$RUNNER_TEMP/promote.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: an issue for what failed
        if: needs.smoke.result != 'success' || needs.train.result != 'success'
        env:
          FILE: ${{ inputs.promote }}
        run: |
          if [ "$FILE" != true ]; then
            echo "::error::$TAG did not pass the gate (a dry run: no issue)"
            exit 1
          fi
          jq -n --arg tag "$TAG" --arg run "$RUN" --argjson needs "$NEEDS" \
            '{tag: $tag, run: $run, results: "results", needs: $needs}' > "$RUNNER_TEMP/issue.json"
          python3 -I .github/scripts/promote.py issue "$RUNNER_TEMP/issue.json" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
