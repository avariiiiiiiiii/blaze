[workspace]
members = ["crates/*", "fuzz"]
# `blaze-wasm` turns on a feature of `hir-ty-codegen` that swaps the code generator's output, which
# must not be unified into a build of the native crates.
exclude = [
    "crates/blaze-wasm",
    "demo",
    "harness",
    # The standard library's own workspace (docs/toolchain.md).
    "library",
    # Hegel, built only as a dependency of blaze's tests (vendor/hegeltest/SOURCE.md).
    "vendor/hegeltest",
    "vendor/hegeltest-c",
    "vendor/hegeltest-macros",
]
resolver = "2"

[workspace.metadata.blaze]
experimental = ["sandboxed-tests"]

# llvm-sys's build script (vendor/llvm-sys/pin.rs) checks the pinned LLVM `nix develop` names.
[workspace.metadata.blaze.sandbox]
build-script-env = ["LLVM_SYS_231_PREFIX"]

[workspace.package]
version = "0.0.0"
rust-version = "1.101"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["blaze contributors"]
repository = "https://github.com/indexable-inc/blaze"
homepage = "https://ix.dev/blaze"
keywords = ["compiler", "jit", "hot-reload", "rust-analyzer", "cargo"]
categories = ["development-tools", "development-tools::build-utils"]

[profile.dev]
debug = 1

[profile.dev.package]
# These speed up local tests.
syntax-tree.opt-level = 3
rustc-hash.opt-level = 3
smol_str.opt-level = 3
text-size.opt-level = 3
serde.opt-level = 3
salsa.opt-level = 3
dissimilar.opt-level = 3
miniz_oxide.opt-level = 3

[profile.release]
# Set this to 1 or 2 to get more useful backtraces in debugger.
debug = 0

[profile.dev-rel]
inherits = "release"
debug = 2

# The binaries a release ships, built with PGO by .github/scripts/build_release.py
# (docs/reports/RELEASE-BUILD.md). Thin LTO takes 4-5% off an edit's work in the daemon but
# makes a rebuild of blaze after a one-line change 2.5 times longer, so `release`, which the
# harnesses and CI build after every change, goes without.
[profile.dist]
inherits = "release"
lto = "thin"
# One unit per crate, so LLVM inlines and lays out across all of it; only the release train
# builds `dist`, so its longer build delays no edit.
codegen-units = 1

[patch.'crates-io']
# The incremental engine.
salsa = { path = "vendor/salsa" }
salsa-macros = { path = "vendor/salsa-macros" }
salsa-macro-rules = { path = "vendor/salsa-macro-rules" }
# Links the pinned LLVM statically, with a static libstdc++ on Linux (vendor/llvm-sys/SOURCE.md).
llvm-sys = { path = "vendor/llvm-sys" }
# Statics that name one section share it, as in LLVM's objects (vendor/cranelift-object/SOURCE.md).
cranelift-object = { path = "vendor/cranelift-object" }

[workspace.dependencies]
# local crates
macros = { path = "crates/macros", version = "0.0.0" }
base-db = { path = "crates/base-db", version = "0.0.0" }
blaze-live = { path = "crates/blaze-live" }
blaze-build-script = { path = "crates/blaze-build-script" }
cfg = { path = "crates/cfg", version = "0.0.0", features = ["tt", "syntax"] }
hir = { path = "crates/hir", version = "0.0.0" }
hir-def = { path = "crates/hir-def", version = "0.0.0" }
hir-expand = { path = "crates/hir-expand", version = "0.0.0" }
hir-lint-levels = { path = "crates/hir-lint-levels", version = "0.0.0" }
hir-ty = { path = "crates/hir-ty", version = "0.0.0" }
hir-ty-borrowck = { path = "crates/hir-ty-borrowck", version = "0.0.0" }
hir-ty-matchck = { path = "crates/hir-ty-matchck", version = "0.0.0" }
hir-ty-unsafeck = { path = "crates/hir-ty-unsafeck", version = "0.0.0" }
hir-ty-mir = { path = "crates/hir-ty-mir", version = "0.0.0" }
hir-ty-pure = { path = "crates/hir-ty-pure", version = "0.0.0" }
hir-ty-share = { path = "crates/hir-ty-share", version = "0.0.0" }
hir-ty-ub = { path = "crates/hir-ty-ub", version = "0.0.0" }
hir-ty-wfcheck = { path = "crates/hir-ty-wfcheck", version = "0.0.0" }
hir-ty-codegen = { path = "crates/hir-ty-codegen" }
rustc-symbols = { path = "crates/rustc-symbols" }
# The `proc_macro` of blaze's in-process proc-macro bridge (crates/blaze-macro-wasm/src/native.rs).
native-proc-macro = { package = "blaze-native-proc-macro", path = "crates/blaze-macro-wasm/native/proc_macro" }
blaze-macro-wasm = { path = "crates/blaze-macro-wasm" }
blaze-macro-eval = { path = "crates/blaze-macro-eval" }
blaze-doc = { path = "crates/blaze-doc" }
blaze-fmt = { path = "crates/blaze-fmt" }
blaze-lints = { path = "crates/blaze-lints" }
blaze-manifest = { path = "crates/blaze-manifest" }
blaze-metadata = { path = "crates/blaze-metadata" }
blaze-resolve = { path = "crates/blaze-resolve" }
blaze-source = { path = "crates/blaze-source" }
blaze-units = { path = "crates/blaze-units" }
blaze-lower = { path = "crates/blaze-lower" }
blaze-wasm-pack = { path = "crates/blaze-wasm-pack" }
blaze-new = { path = "crates/blaze-new" }
blaze-tree = { path = "crates/blaze-tree" }
blaze-fuzz = { path = "crates/blaze-fuzz" }
blaze-core = { path = "crates/blaze-core" }
blaze-profile = { path = "crates/blaze-profile" }
blaze-graph = { path = "crates/blaze-graph" }
blaze-image = { path = "crates/blaze-image" }
blaze-protocol = { path = "crates/blaze-protocol" }
blaze-ui = { path = "crates/blaze-ui" }
blaze-web = { path = "crates/blaze-web" }
# v2 (docs/v2/plan/reference/crates.md)
blaze-alloc-count = { path = "crates/blaze-alloc-count" }
blaze-bytes = { path = "crates/blaze-bytes" }
blaze-api = { path = "crates/blaze-api" }
blaze-cas = { path = "crates/blaze-cas" }
blaze-check = { path = "crates/blaze-check" }
blaze-ci = { path = "crates/blaze-ci" }
blaze-codegen = { path = "crates/blaze-codegen" }
blaze-dbsp = { path = "crates/blaze-dbsp" }
blaze-diagnostics = { path = "crates/blaze-diagnostics", version = "0.0.0" }
blaze-format = { path = "crates/blaze-format" }
blaze-ids = { path = "crates/blaze-ids" }
blaze-lint-defs = { path = "crates/blaze-lint-defs", version = "0.0.0" }
blaze-radix = { path = "crates/blaze-radix" }
blaze-rng = { path = "crates/blaze-rng" }
blaze-sha256 = { path = "crates/blaze-sha256" }
blaze-items = { path = "crates/blaze-items" }
blaze-item-hash = { path = "crates/blaze-item-hash" }
blaze-link = { path = "crates/blaze-link" }
blaze-phf = { path = "crates/blaze-phf", version = "0.0.0" }
# fastcompile (docs/v2/plan/lanes/fastcompile/notes.md)
blaze-global = { path = "crates/blaze-global" }
blaze-hashcons = { path = "crates/blaze-hashcons" }
blaze-history = { path = "crates/blaze-history" }
blaze-inproc = { path = "crates/blaze-inproc" }
blaze-intent = { path = "crates/blaze-intent" }
blaze-lazy = { path = "crates/blaze-lazy" }
blaze-premap = { path = "crates/blaze-premap" }
blaze-stencil = { path = "crates/blaze-stencil" }
blaze-testsel = { path = "crates/blaze-testsel" }
blaze-query = { path = "crates/blaze-query" }
blaze-reclaim = { path = "crates/blaze-reclaim" }
blaze-mem = { path = "crates/blaze-mem" }
blaze-usercode = { path = "crates/blaze-usercode" }
blaze-v2-proof = { path = "crates/blaze-v2-proof" }
blaze-vfs = { path = "crates/blaze-vfs" }
# Flecs's C and its read-only REST, for the build page's world (vendor/flecs-c/SOURCE.md).
flecs-c = { path = "vendor/flecs-c" }
intern = { path = "crates/intern", version = "0.0.0" }
mbe = { path = "crates/mbe", version = "0.0.0" }
parser = { path = "crates/parser", version = "0.0.0" }
paths = { path = "crates/paths", version = "0.0.0" }
proc-macro-api = { path = "crates/proc-macro-api", version = "0.0.0" }
proc-macro-srv = { path = "crates/proc-macro-srv", version = "0.0.0" }
profile = { path = "crates/profile", version = "0.0.0" }
span = { path = "crates/span", version = "0.0.0" }
stdx = { path = "crates/stdx", version = "0.0.0" }
syntax = { path = "crates/syntax", version = "0.0.0" }
const-ast = { path = "crates/const-ast", version = "0.0.0" }
syntax-bridge = { path = "crates/syntax-bridge", version = "0.0.0" }
target-features = { path = "crates/target-features", version = "0.0.0" }
test-utils = { path = "crates/test-utils", version = "0.0.0" }
toolchain = { path = "crates/toolchain", version = "0.0.0" }
tt = { path = "crates/tt", version = "0.0.0" }
edition = { path = "crates/edition", version = "0.0.0" }

ra-ap-rustc_lexer = { version = "0.166", default-features = false }
ra-ap-rustc_parse_format = { version = "0.166", default-features = false }
ra-ap-rustc_index = { version = "0.166", default-features = false }
# rustc's layout code, from the tag of the stable in `harness/toolchain`.
rustc_abi = { path = "crates/rustc_abi", version = "0.0.0", default-features = false }
# rustc's lexer at the commit of `harness/toolchain`, for proc-macro-srv.
rustc_lexer = { path = "crates/rustc_lexer", version = "0.0.0" }
unicode-properties = { version = "0.1.4", default-features = false }
ra-ap-rustc_pattern_analysis = { version = "0.166", default-features = false }
ra-ap-rustc_ast_ir = { version = "0.166", default-features = false }
rustc_apfloat = "0.2.3"
# The trait solver, with fixes of rustc's backported.
rustc_type_ir = { path = "vendor/rustc_type_ir", version = "0.0.0", default-features = false }
rustc_type_ir_macros = { path = "vendor/rustc_type_ir_macros", version = "0.0.0" }
rustc_next_trait_solver = { path = "vendor/rustc_next_trait_solver", version = "0.0.0", default-features = false }
# rustc's transmutability analysis, generic over the caller's layouts (vendor/rustc_transmute/PATCHES.md).
rustc_transmute = { path = "vendor/rustc_transmute", version = "0.0.0" }

# rust-analyzer's libraries, from crates.io
line-index = { version = "0.1.2" }
la-arena = { version = "0.3.1" }

# non-local crates
anyhow = "1.0.98"
arrayvec = "0.7.6"
bitflags = "2.9.1"
# Per-task bump arenas in front-end crates, which can't depend on `blaze-graph`'s `arena::Bump`.
bumpalo = { version = "3.20", features = ["collections"] }
# Official BLAKE3: `blaze_ids::b3`'s backend where blake3-servil doesn't build (Windows, x86-64
# macOS), and the reference beside it. `neon`: aarch64 picks NEON at compile time; x86_64
# detects AVX-512 at run time without a feature.
blake3 = { version = "1.8", default-features = false, features = ["std", "neon"] }
# BLAKE3-Servil (johnservil/BLAKE3 `servil`, 0.8.0 on official 1.8.7): `blaze_ids::b3`'s
# backend on x86-64 Linux and AArch64 Linux and macOS (docs/v2/plan/process/decisions.md).
# Its kernels are chosen at run time; `std` alone, and its pool's threads start only in
# `initialize_multithreaded`, which blaze never calls.
blake3-servil = { git = "https://github.com/johnservil/BLAKE3", rev = "c6bd679a0911cc233cb28297f2b25875381215a1", default-features = false, features = ["std"] }
cargo_metadata = "0.23.1"
camino = "1.2.2"
# The Cranelift hir-ty-codegen compiles with.
cranelift-codegen = "0.136"
cranelift-frontend = "0.136"
# The reference interpreter and CLIF reader blaze-stencil's tests check each stencil with.
cranelift-interpreter = "0.136"
cranelift-reader = "0.136"
# `vendor/llvm-sys` by the patch above.
llvm-sys = "231"
crossbeam-channel = "0.5.15"
crossbeam-deque = "0.8.6"
base64 = "0.23"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# `zdict_builder` trains the store's dictionary per kind; `zstdmt` lets long cold values use workers.
zstd = { version = "0.13.3", default-features = false, features = ["zdict_builder", "zstdmt"] }
# `tt`'s proc-macro wire views its columns as bytes with no unsafe code of its own.
zerocopy = { version = "0.8.63", default-features = false, features = ["derive"] }
# `safe-decode`: a rotted pack decodes to an error, never to an out-of-bounds read.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
# rustc renders its diagnostics with exactly this version; another lays some snippets out differently.
annotate-snippets = "=0.12.16"
object = { version = "0.37", default-features = false, features = ["read_core", "std", "archive", "elf", "macho", "coff", "pe", "wasm", "unaligned"] }
gimli = { version = "0.33", default-features = false, features = ["read", "write", "std"] }
either = "1.15.0"
expect-test = "1.5.1"
# Property tests: Hegel, Hypothesis's engine, linked as a Rust crate; test-only, imported as `hegel`
# (docs/contributing.md, vendor/hegeltest/SOURCE.md).
hegeltest = { path = "vendor/hegeltest", default-features = false, features = ["static-engine"] }
indexmap = { version = "2.9.0", features = ["serde"] }
# hir-ty's MIR provider table, which hir-ty-mir registers into.
inventory = "0.3.24"
itertools = "0.15.0"
libc = "0.2.172"
memchr = "2.8.1"
# The `blaze` binary's general-purpose allocator (docs/v2/plan/design/memory.md).
mimalloc = { version = "0.1.52", default-features = false }
# mimalloc's C side, for `mi_collect` when the daemon gives freed pages back, and (`extended`) its
# options for huge pages.
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
nohash-hasher = "0.2.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
pulldown-cmark = { version = "0.9.6", default-features = false }
rayon = "1.10.0"
syntax-tree = { path = "crates/syntax-tree", version = "0.0.0" }
# Ideally we'd not enable the macros feature but unfortunately the `tracked` attribute does not work
# on impls without it
salsa = { version = "0.28.5", default-features = false, features = [
    "rayon",
    "salsa_unstable",
    "macros",
    "inventory",
    "triomphe"
] }
semver = "1.0.26"
serde = { version = "1.0.219" }
serde_derive = { version = "1.0.219" }
serde_json = "1.0.140"
# blaze-ci's webhook payload decode, validating at SIMD speed (docs/v2/plan/lanes/ci.md).
sonic-rs = { version = "0.5", default-features = false }
rustc-hash = "2.1.1"
rustc-literal-escaper = "0.0.7"
# blaze-macro-wasm's WASI host: `openat2` with no symlinks, one open per path a macro reads.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
smallvec = { version = "1.15.1", features = [
    "const_new",
    "union",
    "const_generics",
] }
smol_str = "0.3.2"
text-size = "1.1.1"
toml = "1.1.2"
# Debug and trace callsites compile out of release builds: blaze's one subscriber there, the trace
# recorder (crates/blaze-cargo/src/trace.rs), takes INFO and above.
tracing = { version = "0.1.41", default-features = false, features = ["std", "release_max_level_info"] }
tracing-tree = "0.4.0"
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "registry",
    "fmt",
    "local-time",
    "std",
    "time",
    "tracing-log",
] }
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }
unicode-width = "0.2.2"
url = "2.5.4"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    # `CONTEXT` in `Win32_System_Diagnostics_Debug`.
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
thin-vec = "0.2.21"
hashbrown = { version = "0.17.0", features = [
    "inline-more",
    "nightly",
], default-features = false }

# We need to freeze the version of the crate, as the raw-api feature is considered unstable
dashmap = { version = "=6.2.1", features = ["raw-api", "inline"] }

# We need to freeze this as `1.0.26` breaks the compilation of `rustc_lexer` during our in-tree
# libraries publish
unicode-ident = "=1.0.24"
# rustc's pins (`Cargo.lock` of the pinned nightly): the identifier lints' Unicode tables.
unicode-normalization = "=0.1.25"
unicode-security = "=0.1.2"

[workspace.lints.cargo]
unused_dependencies = "allow"

[workspace.lints.rust]
# remember to update RUSTFLAGS in ci.yml if you add something here, and crates/blaze-live/Cargo.toml's
# [lints], a written-out copy of these

elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(bootstrap)',
    "cfg(no_salsa_async_drops)",
    "cfg(blaze_check)",
] }
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
## lint groups
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

## allow following lints
too_long_first_doc_paragraph = "allow"
# subjective
single_match = "allow"
# () makes a fine error in most cases
result_unit_err = "allow"
# We don't expose public APIs that matter like this
len_without_is_empty = "allow"
# We have macros that rely on this currently
enum_variant_names = "allow"
# Builder pattern disagrees
new_ret_no_self = "allow"
# Has a bunch of false positives
useless_asref = "allow"
# Has false positives
assigning_clones = "allow"
# Does not work with macros
vec_init_then_push = "allow"
# Our tests have a lot of these
literal_string_with_formatting_args = "allow"
# This lint has been empowered but now also triggers on cases where its invalid to do so
# due to it ignoring move analysis
unnecessary_map_or = "allow"

## Following lints should be tackled at some point
too_many_arguments = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"

## deny: allocation, dyn and clones are controlled mechanically
## (docs/v2/plan/goals/principles.md)
redundant_clone = "deny"
clone_on_ref_ptr = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
inefficient_to_string = "deny"
format_collect = "deny"
needless_pass_by_value = "deny"
large_types_passed_by_value = "deny"
box_collection = "deny"
vec_box = "deny"
rc_buffer = "deny"
large_enum_variant = "deny"

## deny: every unsafe block says why it is sound, one operation each
## (docs/v2/plan/design/unsafe.md)
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

## warn at following lints
# CI raises these to deny
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

str_to_string = "warn"
