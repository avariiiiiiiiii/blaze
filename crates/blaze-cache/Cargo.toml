[package]
name = "blaze-cache"
version = "0.1.0"
description = "#[blaze::cache]: results of pure functions kept across runs, dropped when the code they reach changes"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Indexable, Inc."]
repository = "https://github.com/indexable-inc/blaze"
homepage = "https://ix.dev/blaze"
readme = "README.md"
keywords = ["cache", "memoize", "jit", "incremental"]
categories = ["development-tools", "caching"]

[lib]
# Written `#[blaze::cache]`, as the attribute is blaze's.
name = "blaze"

[dependencies]
blaze-cache-macros.workspace = true
serde = { workspace = true, features = ["std"] }
postcard = { workspace = true, features = ["alloc"] }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
