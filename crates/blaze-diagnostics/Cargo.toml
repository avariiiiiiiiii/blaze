[package]
name = "blaze-diagnostics"
description = "Compile errors and warnings as rustc gives them: computed from the front end's queries, each with the facts it read, written as rustc and cargo write them"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# The version rustc renders its diagnostics with (`rustc_errors`'s
# `annotate_snippet_emitter_writer.rs`), so that ours read byte for byte as rustc's do.
annotate-snippets.workspace = true
either.workspace = true
hashbrown.workspace = true
memchr.workspace = true
ra-ap-rustc_lexer.workspace = true
ra-ap-rustc_parse_format.workspace = true
rustc_apfloat.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
smallvec.workspace = true
unicode-ident.workspace = true
unicode-normalization.workspace = true
unicode-security.workspace = true

base-db.workspace = true
blaze-api.workspace = true
blaze-ids.workspace = true
blaze-items.workspace = true
blaze-lint-defs.workspace = true
blaze-mem.workspace = true
blaze-phf.workspace = true
blaze-query.workspace = true
cfg.workspace = true
hir.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-lint-levels.workspace = true
hir-ty.workspace = true
hir-ty-borrowck.workspace = true
intern.workspace = true
rustc_abi.workspace = true
rustc_type_ir.workspace = true
span.workspace = true
stdx.workspace = true
syntax.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-format.workspace = true
expect-test.workspace = true
proptest.workspace = true
salsa.workspace = true
test-fixture.workspace = true
triomphe.workspace = true

[lints]
workspace = true
