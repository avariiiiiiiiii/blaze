# A hot crate's lints (docs/v2/plan/design/concurrency.md): the root `.clippy.toml`, which clippy
# does not read for a crate that has its own, plus no lock. Keep the first part equal to the root's.
disallowed-types = [
    { path = "std::collections::HashMap", replacement = "rustc_hash::FxHashMap" },
    { path = "std::collections::HashSet", replacement = "rustc_hash::FxHashSet" },
    { path = "std::collections::hash_map::RandomState", replacement = "std::hash::BuildHasherDefault<FxHasher>"},

    { path = "std::sync::Mutex", reason = "no lock on the hot path (docs/v2/plan/design/concurrency.md): readers publish and load with release and acquire, writers claim slots with a compare-and-swap, and a guard held across a query call can deadlock or invert priorities. A lock that must be is a named type whose comment says why it is never held across a call, with this lint allowed on it" },
    { path = "std::sync::RwLock", reason = "a read writes no shared memory (docs/v2/plan/design/concurrency.md): an RwLock's read side is an atomic write to one shared counter, so readers on every core contend on its cache line. Publish immutable values with one release store and read them with acquire loads" },
    { path = "parking_lot::Mutex", reason = "no lock on the hot path (docs/v2/plan/design/concurrency.md); see std::sync::Mutex", allow-invalid = true },
    { path = "parking_lot::RwLock", reason = "a read writes no shared memory (docs/v2/plan/design/concurrency.md); see std::sync::RwLock", allow-invalid = true },
    { path = "dashmap::DashMap", reason = "each shard of a DashMap is an RwLock, so a lookup writes a shared counter (docs/v2/plan/design/concurrency.md). Use an append-only open-addressed table published with release stores", allow-invalid = true },
]

disallowed-methods = [
    { path = "std::process::Command::new", replacement = "toolchain::command", reason = "the latter forces the choice of a working directory" },
]
