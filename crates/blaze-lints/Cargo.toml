[package]
name = "blaze-lints"
description = "clippy's lints and blaze's own, owned by blaze: per-body queries over the front end's database, with clippy's names, levels, groups, configuration and messages"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
# The version rustc 1.101 renders its diagnostics with (`rustc_errors`'s
# `annotate_snippet_emitter_writer.rs`), so that ours read byte for byte as clippy's do.
annotate-snippets = "=0.12.16"
base-db.workspace = true
blaze-ids.workspace = true
blaze-phf.workspace = true
cfg.workspace = true
either.workspace = true
hir.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-ty.workspace = true
intern.workspace = true
memchr.workspace = true
rustc-hash.workspace = true
rustc_type_ir.workspace = true
salsa.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
span.workspace = true
syntax.workspace = true
toml.workspace = true
triomphe.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
expect-test.workspace = true
test-fixture.workspace = true

[lints]
workspace = true
