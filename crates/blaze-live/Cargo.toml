[package]
name = "blaze-live"
version = "0.1.0"
description = "Applies blaze's edits to a program while it runs"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Indexable, Inc."]
repository = "https://github.com/indexable-inc/blaze"
homepage = "https://ix.dev/blaze"
readme = "README.md"
keywords = ["hot-reload", "live-reload", "jit", "compiler"]
categories = ["development-tools"]

[dependencies]

# By path and with its lints written out, never `workspace = true`: blaze-live is built outside
# this workspace too (demo/life, user programs, `tools/nix/life_launch.py`, `harness/tiers.py`),
# where no root `Cargo.toml` is found. Keep the lints equal to the root's `[workspace.lints]`.
[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-ids.workspace = true

[target.'cfg(blaze_check)'.dev-dependencies]
blaze-check.workspace = true

[lints.cargo]
unused_dependencies = "allow"

[lints.rust]
elided_lifetimes_in_paths = "warn"
explicit_outlives_requirements = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(bootstrap)',
    "cfg(blaze_check)",
] }
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"

[lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
restriction = { level = "allow", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

too_long_first_doc_paragraph = "allow"
single_match = "allow"
result_unit_err = "allow"
len_without_is_empty = "allow"
enum_variant_names = "allow"
new_ret_no_self = "allow"
useless_asref = "allow"
assigning_clones = "allow"
vec_init_then_push = "allow"
literal_string_with_formatting_args = "allow"
unnecessary_map_or = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
wrong_self_convention = "allow"

redundant_clone = "deny"
clone_on_ref_ptr = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
inefficient_to_string = "deny"
format_collect = "deny"
needless_pass_by_value = "deny"
large_types_passed_by_value = "deny"
box_collection = "deny"
vec_box = "deny"
rc_buffer = "deny"
large_enum_variant = "deny"

undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
str_to_string = "warn"
