[package]
name = "blaze-stencil"
description = "blaze v2's copy-and-patch backend for dev runs: functions compiled by copying stencils LLVM made at blaze's build time and patching their holes, tiered up to Cranelift or LLVM when hot"
publish = false
build = "build.rs"

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-codegen.workspace = true
cranelift-codegen.workspace = true
rustc-hash.workspace = true
smallvec.workspace = true

[build-dependencies]
# The stencils are made by LLVM when blaze is built (docs/v2/plan/lanes/fastcompile/stencil.md,
# "Why a build script"): the generator in `gen/` drives it through its C API.
llvm-sys.workspace = true
object.workspace = true

[dev-dependencies]
cranelift-codegen = { workspace = true, features = ["x86", "arm64"] }
cranelift-frontend.workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true

[lints]
workspace = true
