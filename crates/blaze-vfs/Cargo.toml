[package]
name = "blaze-vfs"
description = "blaze v2's source of truth: a content-addressed Merkle tree of every file, named heads, views (a branch, a PR, a CI job as a root), and the journal that makes them durable through blaze-core's effects"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
blaze-core.workspace = true
blaze-ids.workspace = true
rustc-hash.workspace = true
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
