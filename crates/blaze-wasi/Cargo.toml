[package]
name = "blaze-wasi"
description = "Build scripts compiled for wasm32-wasip1 and run under Wasmtime: blaze's std::process for them, the run-tool import they call, and the runner"
publish = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

[features]
# The runner: Wasmtime, with WASI preview 1, and the host side of `blaze.run_tool`.
run = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:anyhow", "dep:blaze-cas", "dep:blaze-format", "dep:blaze-ids"]

[dependencies]
anyhow = { workspace = true, optional = true }
blaze-cas = { workspace = true, optional = true }
blaze-format = { workspace = true, optional = true }
blaze-ids = { workspace = true, optional = true }
# Wasmtime 49 is built on Cranelift 0.136, which hir-ty-codegen uses.
wasmtime = { version = "49", optional = true, default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "parallel-compilation", "demangle"] }
wasmtime-wasi = { version = "49", optional = true, default-features = false, features = ["p1"] }

[dev-dependencies]
blaze-alloc-count.workspace = true

[lints]
workspace = true
