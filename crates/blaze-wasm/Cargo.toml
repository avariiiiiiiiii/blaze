[package]
name = "blaze-wasm"
version = "0.1.0"
description = "blaze's compiler as a library that emits WebAssembly, to run in a browser"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# A workspace of its own: the `wasm` feature of `hir-ty-codegen` swaps what it emits, and in
# the main workspace cargo would turn it on for native `blaze` as well.
[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
blaze-cas = { path = "../blaze-cas" }
blaze-codegen = { path = "../blaze-codegen" }
blaze-format = { path = "../blaze-format" }
blaze-ids = { path = "../blaze-ids" }
blaze-items = { path = "../blaze-items" }
blaze-wasm-pack = { path = "pack", version = "0.0.0" }
rustc-hash = "2.1.1"
wasm-encoder = { version = "0.244", default-features = false, features = ["std"] }
triomphe = { version = "0.1.14", default-features = false, features = ["std"] }

base-db = { path = "../base-db", version = "0.0.0" }
hir = { path = "../hir", version = "0.0.0" }
hir-def = { path = "../hir-def", version = "0.0.0" }
hir-ty = { path = "../hir-ty", version = "0.0.0" }
hir-ty-codegen = { path = "../hir-ty-codegen", features = ["wasm"] }
cfg = { path = "../cfg", version = "0.0.0", features = ["tt", "syntax"] }
intern = { path = "../intern", version = "0.0.0" }
span = { path = "../span", version = "0.0.0" }
stdx = { path = "../stdx", version = "0.0.0" }
hir-expand = { path = "../hir-expand", version = "0.0.0" }
serde_json = "1.0.140"
dioxus-rsx = "=0.7.10"
core-macro = { path = "core-macro", version = "0.0.0" }
proc-macro2 = "1"
quote = "1"
syn = "2"

[dev-dependencies]
wasmparser = "0.244"

[profile.release]
debug = 0

[patch.crates-io]
cranelift-object = { path = "../../vendor/cranelift-object" }
