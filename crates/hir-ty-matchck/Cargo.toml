[package]
name = "hir-ty-matchck"
version = "0.0.0"
repository.workspace = true
description = "rustc's match checking (`check_match`) over rust-analyzer's bodies and `rustc_pattern_analysis`."

authors.workspace = true
edition.workspace = true
license.workspace = true
