[package]
name = "hir-ty-mir"
version = "0.0.0"
repository.workspace = true
description = "MIR's passes over rust-analyzer's MIR: lowering, rustc's passes and optimizations, monomorphization and the interpreter."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
itertools.workspace = true
arrayvec.workspace = true
smallvec.workspace = true
either.workspace = true
tracing = { workspace = true, features = ["attributes"] }
rustc-hash.workspace = true
hashbrown.workspace = true
la-arena.workspace = true
triomphe.workspace = true
inventory.workspace = true
rustc_apfloat = "0.2.3"
oorandom = "11.1.5"
salsa.workspace = true

rustc_abi.workspace = true
ra-ap-rustc_ast_ir.workspace = true
rustc_type_ir.workspace = true
rustc_next_trait_solver.workspace = true

# local deps
blaze-ids.workspace = true
blaze-mem.workspace = true
stdx.workspace = true
macros.workspace = true
intern.workspace = true
cfg.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-ty.workspace = true
base-db.workspace = true
syntax.workspace = true
span.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
hir.workspace = true
test-fixture.workspace = true

[features]
in-rust-tree = ["hir-ty/in-rust-tree"]

[lints]
workspace = true
