[package]
name = "hir"
version = "0.0.0"
repository.workspace = true
description = "A high-level object-oriented access to Rust code for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
rustc-hash.workspace = true
either.workspace = true
arrayvec.workspace = true
itertools.workspace = true
hashbrown.workspace = true
serde_json.workspace = true
smallvec.workspace = true
tracing = { workspace = true, features = ["attributes"] }
triomphe.workspace = true
la-arena.workspace = true
salsa.workspace = true

rustc_type_ir.workspace = true

# local deps
base-db.workspace = true
blaze-hashcons.workspace = true
blaze-ids.workspace = true
blaze-mem.workspace = true
cfg.workspace = true
hir-def.workspace = true
hir-expand.workspace = true
hir-ty.workspace = true
hir-ty-mir.workspace = true
hir-ty-borrowck.workspace = true
hir-ty-matchck.workspace = true
hir-ty-unsafeck.workspace = true
hir-ty-wfcheck.workspace = true
intern.workspace = true
stdx.workspace = true
syntax.workspace = true
tt.workspace = true
span.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
blaze-format.workspace = true
expect-test.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tree.workspace = true

# local deps
test-utils.workspace = true
hir-expand = { workspace = true, features = ["fixture"] }
syntax-bridge.workspace = true

[features]
in-rust-tree = ["hir-expand/in-rust-tree"]

[lints]
workspace = true
