[package]
name = "load-cargo"
version = "0.0.0"
repository.workspace = true
description = "Loads a Cargo project into a static instance of rust-analyzer for analysis."

rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
itertools.workspace = true
tracing.workspace = true
triomphe.workspace = true

# workspace deps

cfg.workspace = true
hir-expand.workspace = true
ide-db.workspace = true
proc-macro-api.workspace = true
project-model.workspace = true
span.workspace = true
tt.workspace = true
vfs-notify.workspace = true
vfs.workspace = true
intern.workspace = true

# v2's lowering of a build's units (`v2`)
base-db.workspace = true
blaze-graph.workspace = true
blaze-ids.workspace = true
blaze-query.workspace = true
blaze-units = { workspace = true, features = ["query"] }
blaze-vfs.workspace = true
hir.workspace = true
line-index.workspace = true
rustc-hash.workspace = true
salsa.workspace = true
toml.workspace = true

[features]
in-rust-tree = ["hir-expand/in-rust-tree", "proc-macro-api/in-rust-tree"]

[lints]
workspace = true
