[package]
name = "proc-macro-srv-cli"
version = "0.0.0"
repository.workspace = true
description = "blaze's proc-macro server: the program that loads the proc-macro libraries blaze links and expands with them."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
doctest = false

[[bin]]
name = "blaze-proc-macro-srv"
path = "src/main.rs"

[dependencies]
blaze-usercode.workspace = true
paths.workspace = true
proc-macro-api = { workspace = true, features = ["in-rust-tree"] }
proc-macro-srv.workspace = true
tt.workspace = true

[dev-dependencies]
intern.workspace = true

# The proc macros the tests expand, as the shared library blaze links (`proc-macro-libraries`).
proc-macro-test-impl.path = "../proc-macro-srv/proc-macro-test"

[lints]
workspace = true

# A blaze extension: each proc-macro dependency named here is linked as a shared library with
# blaze's list of its macros, and the package's crates are told its path as
# `BLAZE_PROC_MACRO_LIBRARY_<NAME>` (the name upper-cased, `-` as `_`).
[package.metadata.blaze]
proc-macro-libraries = ["proc-macro-test-impl"]
