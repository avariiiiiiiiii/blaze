[package]
name = "proc-macro-srv"
version = "0.0.0"
repository.workspace = true
description = "Proc-macro server for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
blaze-mem = { workspace = true, optional = true }
paths = { workspace = true, optional = true }
rustc-hash = { workspace = true, optional = true }
# span = {workspace = true, default-features = false} does not work
span = { path = "../span", version = "0.0.0", default-features = false, optional = true }
intern = { workspace = true, optional = true }
stdx = { workspace = true, optional = true }
tt = { workspace = true, optional = true }

[dev-dependencies]
blaze-alloc-count.workspace = true
expect-test.workspace = true
line-index.workspace = true

# used as proc macro test targets
proc-macro-test.path = "./proc-macro-test"

[features]
default = []
in-rust-tree = ["dep:blaze-mem", "dep:intern", "dep:paths", "dep:rustc-hash", "dep:span", "dep:stdx", "dep:tt"]

[lints]
workspace = true

[package.metadata.rust-analyzer]
rustc_private=true
