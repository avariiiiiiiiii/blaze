[package]
name = "proc-macro-srv"
version = "0.0.0"
repository.workspace = true
description = "Proc-macro server for rust-analyzer."

authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
blaze-mem.workspace = true
paths.workspace = true
rustc-hash.workspace = true
# span = {workspace = true, default-features = false} does not work
span = { path = "../span", version = "0.0.0", default-features = false }
intern.workspace = true
rustc_lexer.workspace = true
stdx.workspace = true
tt.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
blaze-alloc-count.workspace = true
expect-test.workspace = true
line-index.workspace = true

# The proc macros the tests expand, as the shared library blaze links (`proc-macro-libraries`).
proc-macro-test-impl.path = "./proc-macro-test"

[lints]
workspace = true

# A blaze extension: each proc-macro dependency named here is linked as a shared library with
# blaze's list of its macros, and the package's crates are told its path as
# `BLAZE_PROC_MACRO_LIBRARY_<NAME>` (the name upper-cased, `-` as `_`).
[package.metadata.blaze]
proc-macro-libraries = ["proc-macro-test-impl"]
