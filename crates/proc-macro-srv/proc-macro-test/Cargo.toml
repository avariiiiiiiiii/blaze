# The proc macros proc-macro-srv's tests expand. blaze links it as a shared library for them and
# names the library in `BLAZE_PROC_MACRO_LIBRARY_PROC_MACRO_TEST_IMPL` (`proc-macro-libraries`
# in proc-macro-srv's manifest).
[package]
name = "proc-macro-test-impl"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
doctest = false
proc-macro = true
