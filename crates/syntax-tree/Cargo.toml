# blaze's syntax trees: rowan 0.17.0 from crates.io, with a second kind of tree in its cursor,
# a flat one (`flat.rs`): packed arrays of about 8.5 bytes an element over a shared source, with
# lazy nodes whose parts are parsed when a cursor enters them. Every parse makes a flat tree;
# green trees remain for editing. Everything else is as published.
[package]
name = "syntax-tree"
version = "0.0.0"
authors = ["Aleksey Kladov <aleksey.kladov@gmail.com>"]
repository.workspace = true
license = "MIT OR Apache-2.0"
description = "Library for generic lossless syntax trees"
edition = "2021"
publish = false

exclude = [".github/", "bors.toml", "rustfmt.toml"]

[dependencies]
rustc-hash = "1.0.1"
hashbrown = { version = "0.14.3", features = [
    "inline-more",
], default-features = false }
text-size = "1.1.0"
memoffset = "0.9"
countme = "3.0.0"

serde = { version = "1.0.89", optional = true, default-features = false }

[features]
serde1 = ["serde", "text-size/serde"]
