[package]
name = "blaze-fuzzer"
description = "Coverage-guided fuzzing of every parser of untrusted bytes in blaze: the engine, and one target binary per parser"
publish = false
autobins = false
autotests = false
autoexamples = false
autobenches = false

version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
doctest = false

# One binary per target; `targets/{cas_shared,hir_shared,hir_expr_shared,macro_wasm_guest,
# proc_macro_shared}.rs` are modules of their targets.
[[bin]]
name = "api_cbor"
path = "targets/api_cbor.rs"

[[bin]]
name = "api_cbor_encode"
path = "targets/api_cbor_encode.rs"

[[bin]]
name = "api_envelope"
path = "targets/api_envelope.rs"

